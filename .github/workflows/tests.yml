name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testthat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true   # install Linux binaries (fast), not source

      - name: Install test dependencies
        shell: Rscript {0}
        run: install.packages(c("testthat", "RANN", "clue", "jsonlite", "withr"))

      - name: Run test suite
        run: Rscript run_tests.R
