name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testthat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          # Same R as renv.lock, so CI tests the version the results were made with.
          r-version: '4.6.1'
          use-public-rspm: true   # install Linux binaries (fast), not source

      # Every package DESCRIPTION declares (Imports + Suggests), with their
      # system libraries. Installing only a hand-picked subset made the tests
      # that need png/ggplot2/readxl/magick skip silently.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: any::testthat

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python requirements
        run: pip install -r inst/python/requirements.txt

      - name: Run test suite
        run: Rscript run_tests.R
